<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع صورة أو فيديو إلى تيليجرام</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #5a5a5a;
        }
        #mediaInput {
            width: 100%;
            margin: 10px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #4cae4c;
        }
        #posts-container {
            margin-top: 20px;
        }
        .post {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .post-text {
            font-size: 14px;
            margin-bottom: 10px;
        }
        img, video {
            max-width: 100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>رفع صورة أو فيديو إلى تيليجرام</h1>
        <input type="file" id="mediaInput" accept="image/*,video/*">
        <button id="uploadBtn">رفع</button>
        <div id="posts-container"></div>
    </div>
    <script>
        const token = '6618648466:AAFGGTIx055y0eCRvq_z3ABqchHfLsqD0M4'; // توكن البوت
        const chatId = 'YOUR_CHAT_ID'; // استبدل هذا بـ ID المحادثة الصحيح
        const apiUrl = `https://api.telegram.org/bot${token}/sendPhoto`; // لتحميل الصورة
        const apiUrlVideo = `https://api.telegram.org/bot${token}/sendVideo`; // لتحميل الفيديو
        let postsSet = new Set(); // مجموعة لتخزين معرفات المنشورات الفريدة

        document.getElementById('uploadBtn').addEventListener('click', function() {
            const mediaInput = document.getElementById('mediaInput');
            const file = mediaInput.files[0];
            if (file) {
                const formData = new FormData();
                formData.append('chat_id', chatId); // ID المحادثة
                if (file.type.startsWith('video/')) {
                    formData.append('video', file);
                    uploadMedia(apiUrlVideo, formData, file);
                } else {
                    formData.append('photo', file);
                    uploadMedia(apiUrl, formData, file);
                }
            }
        });

        function uploadMedia(apiUrl, formData, file) {
            fetch(apiUrl, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    const mediaUrl = `https://api.telegram.org/file/bot${token}/${data.result.file_path}`;
                    displayPost(mediaUrl, file.name, file.type.split('/')[0]);
                } else {
                    console.error('Error uploading media:', data);
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function displayPost(mediaUrl, caption, type) {
            if (postsSet.has(mediaUrl)) {
                return; // تجاهل المنشورات المكررة
            }
            postsSet.add(mediaUrl);

            const postsContainer = document.getElementById('posts-container');
            const post = document.createElement('div');
            post.classList.add('post');

            const postText = document.createElement('div');
            postText.classList.add('post-text');
            postText.innerText = caption;

            let mediaElement;
            if (type === 'image') {
                mediaElement = document.createElement('img');
                mediaElement.src = mediaUrl;
            } else if (type === 'video') {
                mediaElement = document.createElement('video');
                mediaElement.src = mediaUrl;
                mediaElement.controls = true;
            }

            post.appendChild(postText);
            post.appendChild(mediaElement);
            postsContainer.appendChild(post);
        }
    </script>
</body>
</html>
