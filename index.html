<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Media Fetcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        .container {
            width: 80%;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        h1 {
            font-size: 24px;
            color: #333;
        }

        #upload-image {
            display: inline-block;
            margin-right: 10px;
        }

        #upload-btn {
            padding: 10px 20px;
            background-color: #28a745;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .posts-container {
            margin-top: 20px;
        }

        .post {
            background-color: #fff;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post img, .post video {
            max-width: 200px;
            border-radius: 8px;
        }

        .post-text {
            flex: 1;
            margin-right: 20px;
        }

        .delete-btn {
            background-color: #dc3545;
            color: #fff;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        #filter-select {
            margin-top: 20px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>المنشورات من تيليجرام</h1>
            <input type="file" id="upload-image" accept="image/*">
            <button id="upload-btn">نشر صورة</button>
        </header>
        <div id="posts-container" class="posts-container"></div>
        <select id="filter-select">
            <option value="all">عرض الجميع</option>
            <option value="media">عرض الوسائط فقط</option>
            <option value="filter">فلترة المحتوى غير اللائق</option>
        </select>
    </div>

    <script>
        const token = '6618648466:AAFGGTIx055y0eCRvq_z3ABqchHfLsqD0M4';
        const apiUrl = `https://api.telegram.org/bot${token}/getUpdates`;
        let lastMessageId = 0; 
        let filters = { showMedia: true, filterNSFW: false }; 

        function loadSavedPosts() {
            const savedPosts = JSON.parse(localStorage.getItem('telegramPosts')) || [];
            savedPosts.forEach(post => {
                if (filters.showMedia || post.type !== 'photo' && post.type !== 'video') {
                    displayPost(post.mediaUrl, post.caption, post.type, post.messageId);
                }
            });
        }

        function savePost(messageId, mediaUrl, caption, type) {
            const savedPosts = JSON.parse(localStorage.getItem('telegramPosts')) || [];
            if (!savedPosts.some(post => post.messageId === messageId)) { // منع التكرار
                savedPosts.push({ messageId, mediaUrl, caption, type });
                localStorage.setItem('telegramPosts', JSON.stringify(savedPosts));
            }
        }

        function deletePost(messageId) {
            let savedPosts = JSON.parse(localStorage.getItem('telegramPosts')) || [];
            savedPosts = savedPosts.filter(post => post.messageId !== messageId);
            localStorage.setItem('telegramPosts', JSON.stringify(savedPosts));
            document.getElementById(`post-${messageId}`).remove();
        }

        function fetchUpdates() {
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    const messages = data.result;
                    const savedPosts = JSON.parse(localStorage.getItem('telegramPosts')) || [];

                    messages.forEach(message => {
                        if (message.message && message.message.message_id > lastMessageId) {
                            lastMessageId = message.message.message_id;

                            if (message.message.text === 'ok') {
                                displayPost('', 'تم كتابة "ok" في تيليجرام', 'text', message.message.message_id);
                            }

                            if (!savedPosts.some(post => post.messageId === message.message.message_id)) {
                                if (message.message.photo) {
                                    const lastPhoto = message.message.photo[message.message.photo.length - 1];
                                    const fileId = lastPhoto.file_id;
                                    const caption = message.message.caption || 'صورة جديدة من تيليجرام';
                                    fetchMedia(fileId, caption, 'photo', message.message.message_id);
                                }

                                if (message.message.video) {
                                    const videoFile = message.message.video.file_id;
                                    const caption = message.message.caption || 'فيديو جديد من تيليجرام';
                                    fetchMedia(videoFile, caption, 'video', message.message.message_id);
                                }
                            }
                        }
                    });
                })
                .catch(error => console.error('Error fetching updates:', error));
        }

        function fetchMedia(fileId, caption, type, messageId) {
            const fileUrl = `https://api.telegram.org/bot${token}/getFile?file_id=${fileId}`;
            fetch(fileUrl)
                .then(response => response.json())
                .then(data => {
                    const filePath = data.result.file_path;
                    const mediaUrl = `https://api.telegram.org/file/bot${token}/${filePath}`;

                    if (filters.filterNSFW && isNSFW(caption)) {
                        return; 
                    }

                    displayPost(mediaUrl, caption, type, messageId);
                    savePost(messageId, mediaUrl, caption, type);
                })
                .catch(error => console.error('Error fetching media:', error));
        }

        function isNSFW(caption) {
            const nsfwKeywords = ['sex', 'porn', 'nude']; 
            return nsfwKeywords.some(keyword => caption.toLowerCase().includes(keyword));
        }

        function displayPost(mediaUrl, caption, type, messageId) {
            const postsContainer = document.getElementById('posts-container');
            if (document.getElementById(`post-${messageId}`)) return; // منع التكرار

            const post = document.createElement('div');
            post.classList.add('post');
            post.id = `post-${messageId}`;

            const postText = document.createElement('div');
            postText.classList.add('post-text');
            postText.innerText = caption;

            let mediaElement;
            if (type === 'photo' && mediaUrl) {
                mediaElement = document.createElement('img');
                mediaElement.src = mediaUrl;
            } else if (type === 'video' && mediaUrl) {
                mediaElement = document.createElement('video');
                mediaElement.src = mediaUrl;
                mediaElement.controls = true;
            }

            const deleteButton = document.createElement('button');
            deleteButton.classList.add('delete-btn');
            deleteButton.innerText = 'حذف';
            deleteButton.onclick = () => deletePost(messageId);

            post.appendChild(postText);
            if (mediaElement) post.appendChild(mediaElement);
            post.appendChild(deleteButton);

            postsContainer.appendChild(post);
        }

        document.getElementById('upload-btn').addEventListener('click', () => {
            const fileInput = document.getElementById('upload-image');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const formData = new FormData();
                formData.append('chat_id', 'YOUR_CHAT_ID'); // استبدل `YOUR_CHAT_ID` بـ id المحادثة الخاصة بك
                formData.append('photo', file);

                fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Photo sent to Telegram:', data);
                    const imgUrl = URL.createObjectURL(file);
                    displayPost(imgUrl, 'صورة منشورة من المستخدم', 'photo', Date.now());
                })
                .catch(error => console.error('Error sending photo:', error));
            }
        });

        setInterval(fetchUpdates, 1000);

        window.onload = loadSavedPosts;

        document.getElementById('filter-select').addEventListener('change', function(event) {
            const value = event.target.value;
            if (value === 'filter') {
                filters.filterNSFW = !filters.filterNSFW;
                event.target.value = 'all';
            } else if (value === 'all') {
                filters.showMedia = true;
            } else {
                filters.showMedia = value === 'media';
            }
            loadSavedPosts(); 
        });
    </script>
</body>
</html>
