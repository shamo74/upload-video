<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع صورة أو فيديو إلى تيليجرام</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #5a5a5a;
        }
        #mediaInput {
            width: 100%;
            margin: 10px 0;
        }
        #titleInput, #descriptionInput {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #4cae4c;
        }
        #pending-posts, #approved-posts {
            margin-top: 20px;
        }
        .post {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            background-color: #f9f9f9;
            position: relative;
        }
        .post-text {
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        img, video {
            max-width: 100%;
            border-radius: 5px;
        }
        .notification {
            display: none;
            padding: 10px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>رفع صورة أو فيديو إلى تيليجرام</h1>
        <input type="text" id="titleInput" placeholder="عنوان المنشور" required>
        <input type="text" id="descriptionInput" placeholder="وصف المنشور" required>
        <input type="file" id="mediaInput" accept="image/*,video/*" required>
        <button id="uploadBtn">رفع</button>
        
        <div id="notification" class="notification"></div>
        
        <div id="pending-posts">
            <h2>المنشورات المعلقة</h2>
            <div id="pendingPostsContainer"></div>
        </div>
        
        <div id="approved-posts">
            <h2>منشورات المستخدمين</h2>
            <div id="approvedPostsContainer"></div>
        </div>
    </div>

    <script>
        const token = '6618648466:AAFGGTIx055y0eCRvq_z3ABqchHfLsqD0M4'; // توكن البوت
        const chatId = '6431271423'; // ID المحادثة
        const apiUrl = `https://api.telegram.org/bot${token}/sendPhoto`; // لتحميل الصورة
        const apiUrlVideo = `https://api.telegram.org/bot${token}/sendVideo`; // لتحميل الفيديو
        let pendingPosts = []; // لتخزين المنشورات التي في انتظار الموافقة

        document.getElementById('uploadBtn').addEventListener('click', function() {
            const title = document.getElementById('titleInput').value;
            const description = document.getElementById('descriptionInput').value;
            const mediaInput = document.getElementById('mediaInput');
            const file = mediaInput.files[0];

            if (title && description && file) {
                const formData = new FormData();
                formData.append('chat_id', chatId); // ID المحادثة
                if (file.type.startsWith('video/')) {
                    formData.append('video', file);
                    uploadMedia(apiUrlVideo, formData, title, description);
                } else {
                    formData.append('photo', file);
                    uploadMedia(apiUrl, formData, title, description);
                }
            } else {
                alert("يرجى ملء العنوان والوصف واختيار ملف.");
            }
        });

        function uploadMedia(apiUrl, formData, title, description) {
            fetch(apiUrl, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    const mediaUrl = `https://api.telegram.org/file/bot${token}/${data.result.file_path}`;
                    const pendingPost = { mediaUrl, title, description };
                    if (!pendingPosts.some(post => post.mediaUrl === mediaUrl)) { // تأكد من عدم تكرار المنشور
                        pendingPosts.push(pendingPost);
                        displayPendingPost(pendingPost); // عرض المنشور المعلق
                        alert('تم رفع الوسائط بنجاح، انتظر الموافقة.');
                    } else {
                        alert('هذا المنشور موجود بالفعل في قائمة المنشورات المعلقة.');
                    }
                } else {
                    console.error('Error uploading media:', data);
                }
            })
            .catch(error => console.error('Error:', error));
        }

        function displayPendingPost(post) {
            const pendingPostsContainer = document.getElementById('pendingPostsContainer');
            const postElement = document.createElement('div');
            postElement.classList.add('post');
            postElement.innerHTML = `
                <div class="post-text">${post.title}</div>
                <div class="post-text">${post.description}</div>
                ${post.mediaUrl.endsWith('.jpg') || post.mediaUrl.endsWith('.png') ? 
                    `<img src="${post.mediaUrl}" alt="${post.title}">` : 
                    `<video src="${post.mediaUrl}" controls></video>`}
            `;
            pendingPostsContainer.appendChild(postElement);
        }

        // دالة لاستقبال التحديثات من البوت
        function fetchUpdates() {
            const apiUrlUpdates = `https://api.telegram.org/bot${token}/getUpdates`;
            fetch(apiUrlUpdates)
                .then(response => response.json())
                .then(data => {
                    const messages = data.result;
                    messages.forEach(message => {
                        if (message.message && message.message.text === 'ok') {
                            const approvedPost = pendingPosts.shift(); // احصل على أول منشور في الانتظار
                            if (approvedPost) {
                                displayApprovedPost(approvedPost); // عرض المنشور المعتمد
                                showNotification('تمت الموافقة على المنشور!'); // عرض إشعار الموافقة
                            }
                        }
                    });
                })
                .catch(error => console.error('Error fetching updates:', error));
        }

        function displayApprovedPost(post) {
            const approvedPostsContainer = document.getElementById('approvedPostsContainer');
            const postElement = document.createElement('div');
            postElement.classList.add('post');
            postElement.innerHTML = `
                <div class="post-text">${post.title}</div>
                <div class="post-text">${post.description}</div>
                ${post.mediaUrl.endsWith('.jpg') || post.mediaUrl.endsWith('.png') ? 
                    `<img src="${post.mediaUrl}" alt="${post.title}">` : 
                    `<video src="${post.mediaUrl}" controls></video>`}
            `;
            approvedPostsContainer.appendChild(postElement);
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.innerText = message;
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000); // اختفاء الإشعار بعد 3 ثواني
        }

        // جلب التحديثات كل 5 ثواني
        setInterval(fetchUpdates, 5000);
    </script>
</body>
</html>
